name: Windows GUI Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"

      - name: Compile Python sources
        shell: pwsh
        run: |
          python -m compileall -q app faster_whisper app_gui.py whisper_tkgui.py runtime_hook.py

      - name: Build with PyInstaller
        shell: pwsh
        run: python -m PyInstaller --clean --noconfirm build.spec

      - name: Verify bundle
        shell: pwsh
        run: |
          $bundle = 'dist/whisper_tkgui'
          $required = @(
            "$bundle/whisper_tkgui.exe",
            "$bundle/app/FireRedVAD/fireredvad_vad.onnx",
            "$bundle/app/FireRedVAD/cmvn.ark",
            "$bundle/internal/faster_whisper/assets/silero_vad_v6.onnx",
            "$bundle/gui_config.example.ini",
            "$bundle/LICENSE",
            "$bundle/THIRD_PARTY_NOTICES",
            "$bundle/licenses/FireRedVAD-Apache-2.0.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing build output: $path" }
          }

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path dist/whisper_tkgui -DestinationPath whisper_tkgui-windows.zip -Force

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: whisper_tkgui-windows
          path: whisper_tkgui-windows.zip
          retention-days: 1
